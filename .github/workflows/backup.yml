name: DB Backup

# Täglicher verschlüsselter DB-Dump nach Cloudflare R2 (übertrifft die
# Wochenvorgabe). Läuft unabhängig vom App-Server — auch wenn Railway schläft.
# Siehe BACKUP-KONZEPT.md. Secrets unter: Repo → Settings → Secrets → Actions.

on:
  schedule:
    - cron: '0 3 * * *'        # täglich 03:00 UTC
  workflow_dispatch: {}         # manueller Start (für Tests/Restore-Drill)

# Nur ein Backup-Lauf gleichzeitig.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # awscli NICHT per apt installieren: das Paket existiert in Ubuntu 24.04
      # nicht mehr (exit 100 — daran scheiterte jeder Lauf seit 17.06.), und
      # AWS CLI v2 ist auf den GitHub-Runnern ohnehin vorinstalliert.
      # pg_dump aus dem PGDG-Repo, damit die Client-Version nie älter ist als
      # der Railway-Postgres (pg_dump bricht bei älterem Client hart ab).
      - name: Install postgresql-client (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Run encrypted backup
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_BUCKET:      ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT:    ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          # Neuere AWS-CLI-Versionen senden Default-Integritäts-Checksummen,
          # die S3-kompatible Anbieter wie R2 ablehnen können — nur bei Bedarf.
          AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
        run: bash backend/scripts/backup-db.sh

name: CI

# Lint + test + build + production dependency audit on every push/PR.
# Keeps the main branch green and surfaces new vulnerabilities automatically.
# Audit uses --omit=dev: only PRODUCTION deps ship, so dev-only advisories
# (e.g. the known esbuild/vite dev-server ones) don't fail the build.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · test · build · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint · test · smoke · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres for the write-path smoke suite — catches the class of SQL
    # error mocked unit tests can't see (the 42P08 that once 500'd every
    # profile save). Same image/credentials as scripts/smoke-local.sh.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: jamie_smoke
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Smoke suite (real Postgres)
        run: npm run test:smoke
        env:
          SMOKE_DATABASE_URL: postgres://postgres:pw@localhost:55433/jamie_smoke
      - run: npm audit --omit=dev --audit-level=high
